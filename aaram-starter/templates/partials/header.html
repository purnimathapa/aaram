{% url 'core:home' as home_url %}
<div class="topbar">Cash on Delivery to all 7 provinces &middot; Pay when your mattress arrives</div>

<header class="site-header container">
  <a class="brand" href="{{ home_url }}">
    <span class="brand-wordmark">AARAM</span>
    <span class="brand-ne" lang="ne">आराम</span>
  </a>

  <nav class="main-nav" aria-label="Main">
    <a href="#">Mattresses</a>
    <a href="#">Size guide</a>
    <a href="#">Delivery and COD</a>
    <a href="#">About</a>
  </nav>

  <div class="header-spacer"></div>

  <form class="search-form" role="search" action="#">
    <label class="visually-hidden" for="header-search">Search mattresses</label>
    <input class="search-input" id="header-search" type="search" name="q" placeholder="Search mattresses">
    <button class="search-button" type="submit" aria-label="Search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </button>
  </form>

  <a class="icon-link" href="{% url 'accounts:profile' %}" aria-label="My account">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
  </a>

  <a class="cart-link" href="#" aria-label="Cart">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
  </a>
</header>
