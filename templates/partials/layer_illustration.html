{# Compact CSS layer illustration for product cards. #}
{# Expects: comfort (hex), core (hex). Colours come from the category. #}
<div class="layer-illustration-card" aria-hidden="true">
  <div class="layer-card-cover"></div>
  <div class="layer-card-comfort" style="background: {{ comfort }}"></div>
  <div class="layer-card-core" style="background: {{ core }}"></div>
  <div class="layer-card-base"></div>
</div>
