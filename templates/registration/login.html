{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<section class="auth">
  <h1 class="page-title">Log in</h1>
  <form class="form" method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Log in</button>
    </div>
  </form>
  <p class="auth-alt"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
  <p class="auth-alt">New to AARAM? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</section>
{% endblock %}
