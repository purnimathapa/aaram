<!doctype html>
<html lang="en">
<body style="margin:0;background:#F6F1E9;font-family:Arial,Helvetica,sans-serif;color:#24201C">
  <div style="max-width:560px;margin:0 auto;padding:24px">
    <p style="font-size:22px;font-weight:bold;color:#23395B;margin:0 0 16px">AARAM</p>
    <p>Namaste {{ order.recipient }},</p>
    <p>Your order <strong>{{ order.order_number }}</strong> is now:
      <strong>{{ order.get_status_display }}</strong>.</p>
    <p style="color:#5C5349">{% if order.status == "cancelled" %}If you did not expect this, please call us.{% else %}We will keep you updated as it moves along.{% endif %}</p>
    <p style="margin-top:24px">The AARAM team</p>
  </div>
</body>
</html>
